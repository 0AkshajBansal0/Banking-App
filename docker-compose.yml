services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mydigibank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - digibank-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydigibank"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  digibank-postgres-data:
