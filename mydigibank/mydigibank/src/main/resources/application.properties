spring.application.name=mydigibank

# Load environment variables from .env
spring.config.import=optional:file:.env[.properties]

# Neon PostgreSQL Cloud Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Google API
google.api.key=${GOOGLE_API_KEY:}

# Exchange Rate API
exchangerate.api.key=${EXCHANGERATE_API_KEY:}
exchangerate.api.base=${EXCHANGERATE_API_BASE:https://v6.exchangerate-api.com/v6}